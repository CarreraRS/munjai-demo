<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Munjai — ระบบตัวกลางรับเงินปลอดภัย (Escrow)</title>
    <meta name="description" content="Munjai ตัวกลางพักเงินซื้อขายออนไลน์ ผู้ขายได้เงินชัวร์ ผู้ซื้อได้ของจริง">
    <meta name="theme-color" content="#0B1120">
    <link rel="icon" href="./munjai.png">
    <!-- Tailwind & Fonts -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#0066FF",
                        secondary: "#0A2540",
                        "background-light": "#F8FAFC",
                        "background-dark": "#0B1120",
                        "card-dark": "#111827",
                        "border-dark": "#1F2937",
                        success: "#10B981",
                        warning: "#F59E0B",
                        danger: "#EF4444"
                    },
                    fontFamily: {
                        display: ["Plus Jakarta Sans", "Noto Sans Thai", "sans-serif"]
                    },
                    boxShadow: {
                        'glow': '0 0 20px rgba(0, 102, 255, 0.15)',
                        'glow-success': '0 0 20px rgba(16, 185, 129, 0.15)'
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', 'Noto Sans Thai', sans-serif; transition: background-color 0.3s; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .icon-fill { font-variation-settings: 'FILL' 1; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #374151; }

        .glass-nav { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .chat-me { background-color: #0066FF; color: white; border-radius: 12px 12px 0 12px; }
        .chat-other { background-color: #f1f5f9; color: #0F172A; border-radius: 12px 12px 12px 0; }
        .dark .chat-other { background-color: #1F2937; color: #F8FAFC; border-color: #374151; border-width: 1px;}
        .chat-sys { background-color: rgba(245, 158, 11, 0.1); color: #D97706; border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 8px; font-size: 12px; text-align: center; }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">

    <header class="sticky top-0 z-40 w-full border-b border-slate-200 dark:border-border-dark bg-white/80 dark:bg-background-dark/80 glass-nav">
        <div class="max-w-[1440px] mx-auto px-4 md:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3 cursor-pointer" onclick="app.navigate('home')">
                <img src="./munjai.png" alt="Munjai Logo" class="h-9 w-9 rounded-xl object-cover border border-slate-200 dark:border-slate-700">
                <h1 class="text-xl font-bold tracking-tight text-slate-900 dark:text-white">Munjai<span class="text-primary">.</span></h1>
            </div>
            
            <nav id="top-nav" class="hidden md:flex items-center gap-1"></nav>
            
            <div class="flex items-center gap-3">
                <button onclick="app.toggleTheme()" class="p-2 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
                    <span class="material-symbols-outlined dark:hidden">dark_mode</span>
                    <span class="material-symbols-outlined hidden dark:block text-slate-300">light_mode</span>
                </button>
                <div id="role-badge" class="hidden sm:flex px-3 py-1.5 rounded-full text-xs font-bold items-center gap-1.5"></div>
                <div id="avatar" class="h-8 w-8 rounded-full bg-gradient-to-br from-primary to-indigo-500 text-white text-xs font-bold items-center justify-center ml-2 hidden sm:flex ring-2 ring-primary/30">DS</div>
            </div>
        </div>
    </header>

    <main id="app-container" class="flex-1 flex flex-col w-full max-w-[1440px] mx-auto p-4 md:p-8 animate-fade-in"></main>

    <div id="demo-panel" class="fixed bottom-20 md:bottom-6 right-4 md:right-6 z-50 flex flex-col items-end">
        <button id="demo-fab" onclick="app.toggleDemo()" class="hidden size-12 rounded-full bg-secondary text-white shadow-2xl items-center justify-center border border-slate-700 hover:scale-105 transition" title="ตัวเลือก Demo"><span class="material-symbols-outlined">tune</span></button>
        <div id="demo-body" class="flex flex-col items-end shadow-2xl">
        <div class="bg-secondary dark:bg-black text-white text-[10px] uppercase tracking-wider px-4 py-1.5 rounded-t-xl font-bold border-b border-slate-700 opacity-90">
            ตัวเลือกโหมดสำหรับ Demo
            <button onclick="app.toggleDemo()" class="ml-2 align-middle opacity-70 hover:opacity-100"><span class="material-symbols-outlined text-[14px] align-middle">close</span></button>
        </div>
        <div class="bg-white dark:bg-card-dark p-2 rounded-b-xl rounded-tl-xl shadow-2xl border border-slate-200 dark:border-slate-800 flex flex-col gap-1 w-56">
            <button onclick="app.switchRole('seller')" id="btn-demo-seller" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200">
                <span class="material-symbols-outlined text-primary text-[18px]">store</span> โหมดผู้ขาย (Seller)
            </button>
            <button onclick="app.switchRole('buyer')" id="btn-demo-buyer" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200">
                <span class="material-symbols-outlined text-success text-[18px]">shopping_bag</span> โหมดผู้ซื้อ (Buyer)
            </button>
            <button onclick="app.switchRole('admin')" id="btn-demo-admin" class="flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium transition hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-200">
                <span class="material-symbols-outlined text-danger text-[18px]">admin_panel_settings</span> โหมดแอดมิน (Admin)
            </button>
            <div class="h-px w-full bg-slate-100 dark:bg-slate-800 my-1"></div>
            <button onclick="app.navigate('kyc_landing')" class="flex items-center justify-center gap-2 px-3 py-2 rounded-lg text-xs font-bold transition bg-primary/10 text-primary hover:bg-primary/20">
                <span class="material-symbols-outlined text-[16px]">link</span> จำลองผู้ซื้อกดลิงก์จ่ายเงิน
            </button>
        </div>
        </div>
    </div>

    <nav id="mobile-nav" class="md:hidden fixed bottom-0 inset-x-0 z-40 bg-white/95 dark:bg-background-dark/95 glass-nav border-t border-slate-200 dark:border-border-dark flex px-2 pb-[env(safe-area-inset-bottom)]"></nav>

    <footer class="border-t border-slate-200 dark:border-border-dark mt-8 pb-20 md:pb-0">
        <div class="max-w-[1440px] mx-auto px-4 md:px-8 py-6 flex flex-col sm:flex-row gap-3 justify-between text-xs text-slate-500">
            <p>© 2026 Munjai Co., Ltd. · ระบบตัวกลางรับเงิน (Escrow) ที่คุณมั่นใจ</p>
            <div class="flex gap-4"><a href="javascript:void(0)" class="hover:text-primary">เงื่อนไขการใช้บริการ</a><a href="javascript:void(0)" class="hover:text-primary">นโยบายความเป็นส่วนตัว</a><a href="javascript:void(0)" class="hover:text-primary">ติดต่อเรา</a></div>
        </div>
    </footer>

    <div id="toast-container" class="fixed top-20 right-4 z-[100] flex flex-col gap-2 pointer-events-none"></div>
    <div id="modals-container"></div>

    <script>
        const app = {
            state: {
                role: 'seller',
                view: 'dashboard',
                selectedOrderId: null,
                isDarkMode: true,
                walletBalance: 45200,
                orders: [
                    { 
                        id: 'ORD-992101', title: 'iPhone 15 Pro Max 256GB', price: 38500, fee: 1155, 
                        status: 'shipped', buyer: 'คุณเอ สุขใจ', seller: '@DigitalStore_TH', sellerId: 'S1',
                        trackingNo: 'TH123456789EX', courier: 'Kerry',
                        timeline: [
                            { status: 'created', time: '24 ต.ค. 2569, 10:30 น.' },
                            { status: 'paid', time: '24 ต.ค. 2569, 11:45 น.' },
                            { status: 'shipped', time: '25 ต.ค. 2569, 09:15 น.' }
                        ]
                    },
                    { 
                        id: 'ORD-992102', title: 'รองเท้า Nike Air Jordan 1', price: 8500, fee: 510, 
                        status: 'awaiting_shipment', buyer: 'คุณกิตติ', seller: '@SneakerHead', sellerId: 'S1',
                        deadline: Date.now() + (4 * 24 * 60 * 60 * 1000), extensionReq: null,
                        timeline: [
                            { status: 'created', time: 'วันนี้, 08:00 น.' },
                            { status: 'paid', time: 'วันนี้, 08:30 น.' }
                        ]
                    },
                    { 
                        id: 'ORD-992103', title: 'รับกดบัตรคอนเสิร์ต (Pre-order)', price: 4500, fee: 360, 
                        status: 'awaiting_shipment', buyer: 'น้องเจน', seller: '@TicketMaster', sellerId: 'S1',
                        deadline: Date.now() + (1 * 24 * 60 * 60 * 1000), extensionReq: { days: 7, reason: 'ทางเว็บเลื่อนวันจัดส่งบัตรครับ', status: 'pending' },
                        timeline: [
                            { status: 'created', time: '20 ต.ค. 2569' },
                            { status: 'paid', time: '20 ต.ค. 2569' }
                        ]
                    },
                    { 
                        id: 'ORD-992104', title: 'กระเป๋า Chanel Classic', price: 120000, fee: 3600, 
                        status: 'completed', buyer: 'คุณแพรว', seller: '@BrandnameAuth', sellerId: 'S1',
                        isReviewed: false,
                        timeline: [
                            { status: 'created', time: '10 ต.ค. 2569' },
                            { status: 'paid', time: '10 ต.ค. 2569' },
                            { status: 'shipped', time: '12 ต.ค. 2569' },
                            { status: 'completed', time: '14 ต.ค. 2569' }
                        ]
                    },
                    { 
                        id: 'ORD-992105', title: 'การ์ดจอ RTX 4080 (มือสอง)', price: 28000, fee: 840, 
                        status: 'disputed', buyer: 'คุณบอย', seller: '@PC_Parts_TH', sellerId: 'S1',
                        timeline: [
                            { status: 'created', time: '18 ต.ค. 2569' },
                            { status: 'paid', time: '18 ต.ค. 2569' },
                            { status: 'shipped', time: '19 ต.ค. 2569' },
                            { status: 'disputed', time: '21 ต.ค. 2569' }
                        ]
                    }
                ],
                chatMessages: [
                    { sender: 'buyer', text: 'ของที่ส่งมามีรอยตำหนิเยอะมากครับ ไม่เหมือนในรูปที่ลงขายเลย ขอเปิดข้อพิพาทครับ', time: '10:30 น.' },
                    { sender: 'system', text: 'ระบบระงับการโอนเงินให้ผู้ขายชั่วคราว แอดมินรับเรื่องแล้ว', time: '10:35 น.' },
                    { sender: 'seller', text: 'ก่อนส่งผมถ่ายวิดีโอไว้ ไม่มีรอยนะครับ น่าจะเกิดจากการขนส่ง', time: '10:45 น.' }
                ],
                reviews: [
                    { id: 'R1', buyer: 'คุณแม็ค', rating: 5, comment: 'ส่งไวมาก ของแพ็คมาดีเยี่ยมครับ', date: '10 ต.ค. 2569', reported: false },
                    { id: 'R2', buyer: 'คุณจอย', rating: 4, comment: 'สินค้าตรงปกค่ะ แต่ตอบแชทช้านิดนึง', date: '12 ต.ค. 2569', reported: false }
                ]
            },

            init() {
                this.applyTheme();
                this.switchRole('seller');
                if (window.innerWidth < 768) this.toggleDemo();
                setInterval(() => this.updateCountdowns(), 1000);
            },

            toggleDemo() {
                const b = document.getElementById('demo-body'), f = document.getElementById('demo-fab');
                const hide = !b.classList.contains('hidden');
                b.classList.toggle('hidden', hide); f.classList.toggle('hidden', !hide); f.classList.toggle('flex', hide);
            },

            toggleTheme() {
                this.state.isDarkMode = !this.state.isDarkMode;
                this.applyTheme();
            },

            applyTheme() {
                if(this.state.isDarkMode) document.documentElement.classList.add('dark');
                else document.documentElement.classList.remove('dark');
            },

            switchRole(role) {
                this.state.role = role;
                this.state.view = role === 'admin' ? 'admin_dash' : 'dashboard';
                
                ['seller', 'buyer', 'admin'].forEach(r => {
                    const btn = document.getElementById(`btn-demo-${r}`);
                    if (btn) {
                        if (r === role) btn.classList.add('bg-primary/10', 'text-primary', 'border-primary/20');
                        else btn.classList.remove('bg-primary/10', 'text-primary', 'border-primary/20');
                    }
                });
                
                this.updateNav();
                this.render();
            },

            navigate(view, param = null) {
                if (view === 'home') this.state.view = this.state.role === 'admin' ? 'admin_dash' : 'dashboard';
                else this.state.view = view;
                
                if (param) this.state.selectedOrderId = param;
                this.updateNav();
                this.render();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            },

            updateNav() {
                const nav = document.getElementById('top-nav');
                const badge = document.getElementById('role-badge');
                if(!nav || !badge) return;
                
                const linkCls = (v) => `px-4 py-2 rounded-xl text-sm font-semibold transition-colors ${this.state.view===v || (v==='dashboard' && this.state.view==='order_detail') ? 'text-primary bg-primary/10' : 'text-slate-600 dark:text-slate-300 hover:text-primary hover:bg-slate-50 dark:hover:bg-slate-800'}`;

                if (this.state.role === 'seller') {
                    nav.innerHTML = `
                        <a href="javascript:void(0)" onclick="app.navigate('dashboard')" class="${linkCls('dashboard')}">แดชบอร์ดการขาย</a>
                        <a href="javascript:void(0)" onclick="app.navigate('create')" class="${linkCls('create')}">สร้างดีลใหม่</a>
                        <a href="javascript:void(0)" onclick="app.navigate('wallet')" class="${linkCls('wallet')}">กระเป๋าเงิน</a>
                        <a href="javascript:void(0)" onclick="app.navigate('reviews')" class="${linkCls('reviews')}">รีวิวของฉัน</a>
                    `;
                    badge.innerHTML = `<span class="material-symbols-outlined text-[16px] text-primary">store</span> ผู้ขาย (Seller)`;
                    badge.className = "hidden sm:flex px-3 py-1.5 rounded-full text-xs font-bold items-center gap-1.5 bg-primary/10 text-primary border border-primary/20";
                } else if (this.state.role === 'buyer') {
                    nav.innerHTML = `
                        <a href="javascript:void(0)" onclick="app.navigate('dashboard')" class="${linkCls('dashboard')}">รายการซื้อของฉัน</a>
                        <a href="javascript:void(0)" onclick="app.navigate('wallet')" class="${linkCls('wallet')}">กระเป๋าเงิน</a>
                        <a href="javascript:void(0)" onclick="app.navigate('blacklist')" class="${linkCls('blacklist')}">เช็คประวัติแบล็คลิสต์</a>
                    `;
                    badge.innerHTML = `<span class="material-symbols-outlined text-[16px] text-success">shopping_bag</span> ผู้ซื้อ (Buyer)`;
                    badge.className = "hidden sm:flex px-3 py-1.5 rounded-full text-xs font-bold items-center gap-1.5 bg-success/10 text-success border border-success/20";
                } else {
                    nav.innerHTML = `
                        <a href="javascript:void(0)" onclick="app.navigate('admin_dash')" class="${linkCls('admin_dash')}">ศูนย์ไกล่เกลี่ย (Disputes)</a>
                        <a href="javascript:void(0)" onclick="app.navigate('admin_ext')" class="${linkCls('admin_ext')}">คำร้องขอขยายเวลา</a>
                    `;
                    badge.innerHTML = `<span class="material-symbols-outlined text-[16px] text-danger">shield_person</span> Admin Support`;
                    badge.className = "hidden sm:flex px-3 py-1.5 rounded-full text-xs font-bold items-center gap-1.5 bg-danger/10 text-danger border border-danger/20";
                }
                const icons = { dashboard: 'space_dashboard', create: 'add_circle', wallet: 'account_balance_wallet', reviews: 'star', blacklist: 'gpp_maybe', admin_dash: 'gavel', admin_ext: 'more_time' };
                const mnav = document.getElementById('mobile-nav');
                if (mnav) mnav.innerHTML = [...nav.querySelectorAll('a')].map(a => {
                    const v = a.getAttribute('onclick').match(/'(\w+)'/)[1];
                    const on = a.className.includes('text-primary bg-primary/10');
                    return `<a href="javascript:void(0)" onclick="app.navigate('${v}')" class="flex-1 flex flex-col items-center gap-0.5 py-2 text-[10px] font-semibold ${on ? 'text-primary' : 'text-slate-500'}"><span class="material-symbols-outlined ${on ? 'icon-fill' : ''}">${icons[v]}</span><span class="truncate max-w-full">${a.textContent.replace(/\(.*\)/, '').trim()}</span></a>`;
                }).join('');
                const av = document.getElementById('avatar');
                if (av) av.textContent = { seller: 'DS', buyer: 'KA', admin: 'AD' }[this.state.role];
            },

            formatMoney: (num) => `฿${num.toLocaleString('th-TH', {minimumFractionDigits: 2})}`,
            
            calcFee: (amount) => {
                let fee = 0;
                if (amount < 1000) fee = amount * 0.10;
                else if (amount <= 5000) fee = amount * 0.08;
                else if (amount <= 10000) fee = amount * 0.06;
                else fee = amount * 0.03;
                return fee;
            },

            showToast(msg, type='info') {
                const c = document.getElementById('toast-container');
                if(!c) return;
                const t = document.createElement('div');
                const bg = type === 'success' ? 'bg-success' : (type === 'error' ? 'bg-danger' : 'bg-slate-900 dark:bg-slate-700');
                const icon = type === 'success' ? 'check_circle' : (type === 'error' ? 'error' : 'info');
                t.className = `px-5 py-4 rounded-xl shadow-2xl flex items-center gap-3 text-sm text-white font-bold animate-fade-in ${bg}`;
                t.innerHTML = `<span class="material-symbols-outlined">${icon}</span> <span>${msg}</span>`;
                c.appendChild(t);
                setTimeout(() => t.remove(), 3000);
            },

            render() {
                const c = document.getElementById('app-container');
                const m = document.getElementById('modals-container');
                if(!c || !m) return;
                c.innerHTML = ''; m.innerHTML = '';

                if (this.state.view === 'dashboard' && this.state.role === 'seller') this.renderSellerDashboard(c);
                else if (this.state.view === 'dashboard' && this.state.role === 'buyer') this.renderBuyerDashboard(c);
                else if (this.state.view === 'admin_dash') this.renderAdminDashboard(c);
                else if (this.state.view === 'admin_ext') this.renderAdminExtDashboard(c);
                else if (this.state.view === 'create') this.renderCreateDeal(c);
                else if (this.state.view === 'create_success') this.renderCreateSuccess(c);
                else if (this.state.view === 'order_detail') this.renderOrderDetail(c);
                else if (this.state.view === 'wallet') this.renderWallet(c);
                else if (this.state.view === 'reviews') this.renderReviews(c);
                else if (this.state.view === 'blacklist') this.renderBlacklist(c);
                else if (this.state.view === 'kyc_landing') this.renderKYCLanding(c);
                else if (this.state.view === 'payment_mockup') this.renderPaymentMockup(c);
                
                this.renderModals(m);
                this.updateCountdowns();
            },

            renderSellerDashboard(container) {
                const pending = this.state.orders.filter(o => o.status === 'awaiting_shipment').length;
                const completed = this.state.orders.filter(o => o.status === 'completed').length;

                let html = `
                    <div class="mb-8 flex flex-col md:flex-row justify-between md:items-end gap-4">
                        <div>
                            <h1 class="text-3xl font-black text-slate-900 dark:text-white tracking-tight">แดชบอร์ดผู้ขาย</h1>
                            <p class="text-slate-500 mt-1">จัดการธุรกรรม Escrow และรายได้ของคุณอย่างปลอดภัย</p>
                        </div>
                        <button onclick="app.navigate('create')" class="px-6 py-3 bg-primary text-white font-bold rounded-xl shadow-lg shadow-primary/20 hover:scale-[1.02] transition flex items-center gap-2">
                            <span class="material-symbols-outlined">add_circle</span> สร้างลิงก์จ่ายเงิน
                        </button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                        <div class="rounded-2xl p-6 bg-white dark:bg-card-dark border border-slate-200 dark:border-border-dark shadow-sm">
                            <div class="flex justify-between items-start mb-2">
                                <span class="text-sm font-semibold text-slate-500 uppercase tracking-wider">เงินรอโอน (Escrow)</span>
                                <span class="material-symbols-outlined text-primary p-2 bg-primary/10 rounded-lg">lock</span>
                            </div>
                            <p class="text-3xl font-black text-slate-900 dark:text-white">${this.formatMoney(this.state.orders.filter(o=>['awaiting_shipment','shipped','disputed'].includes(o.status)).reduce((a,o)=>a+o.price-o.fee,0))}</p>
                        </div>
                        <div class="rounded-2xl p-6 bg-white dark:bg-card-dark border border-slate-200 dark:border-border-dark shadow-sm">
                            <div class="flex justify-between items-start mb-2">
                                <span class="text-sm font-semibold text-slate-500 uppercase tracking-wider">รอจัดส่ง</span>
                                <span class="material-symbols-outlined text-warning p-2 bg-warning/10 rounded-lg">schedule</span>
                            </div>

            updateCountdowns() {

                    if(diff <= 0) { el.innerText = 'เลยกำหนด!'; el.classList.replace('text-warning', 'text-danger'); }
                    else {
                        const d = Math.floor(diff / 86400000);
                        const h = Math.floor((diff % 86400000) / 3600000);
                        el.innerText = `${d} วัน ${h} ชม.`;
                    }
                });

            showRejectExtModal(id) { 
                const el = document.getElementById('rej-order-id');
                if(el) el.value = id; 
                const m = document.getElementById('modal-reject');
                if(m) { m.classList.remove('hidden'); m.classList.add('flex'); }
            },
            showReviewModal(id) { 
                const el = document.getElementById('rev-order-id');
                if(el) el.value = id; 
                const m = document.getElementById('modal-review');
                if(m) { m.classList.remove('hidden'); m.classList.add('flex'); }
            },

            renderModals(container) {
                container.innerHTML = `
                    <!-- Chat Modal -->
                    <div id="modal-chat" class="hidden fixed inset-0 z-[60] bg-slate-900/60 backdrop-blur-sm items-center justify-center p-4">
                        <div class="bg-white dark:bg-card-dark rounded-3xl w-full max-w-2xl h-[85vh] shadow-2xl flex flex-col overflow-hidden border border-slate-200 dark:border-border-dark animate-fade-in">
                            <div class="px-6 py-4 border-b border-slate-200 dark:border-border-dark flex justify-between items-center bg-slate-50 dark:bg-slate-800/50">
                                <div>
                                    <h3 class="font-bold text-slate-900 dark:text-white">ห้องไกล่เกลี่ย: <span id="chat-order-id" class="text-primary font-mono"></span></h3>
                                    <p class="text-[10px] text-slate-500">สนทนา 3 ฝ่าย: ผู้ซื้อ • ผู้ขาย • Admin Munjai</p>
                                </div>
                                <button onclick="app.closeModal('modal-chat')" class="text-slate-400 hover:text-slate-700 dark:hover:text-white"><span class="material-symbols-outlined">close</span></button>
                            </div>
                            <div id="chat-box" class="flex-1 overflow-y-auto p-6 bg-slate-50 dark:bg-background-dark"></div>
                            
                            <div id="admin-chat-tools" class="hidden px-6 py-3 bg-slate-100 dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 flex flex-wrap gap-2">
                                <button onclick="app.adminReqEv()" class="text-xs bg-white dark:bg-card-dark border border-warning text-warning px-3 py-2 rounded-lg font-bold hover:bg-warning/10 shadow-sm transition">ขอหลักฐานเพิ่ม</button>
                                <div class="flex-1"></div>
                                <button onclick="app.adminResolve('seller')" class="text-xs bg-success text-white px-3 py-2 rounded-lg font-bold hover:bg-success/90 shadow-sm transition">ตัดสินปล่อยเงินให้ผู้ขาย</button>
                                <button onclick="app.adminResolve('buyer')" class="text-xs bg-danger text-white px-3 py-2 rounded-lg font-bold hover:bg-danger/90 shadow-sm transition">ตัดสินคืนเงินผู้ซื้อ</button>
                            </div>
                            
                            <div class="px-6 py-4 border-t border-slate-200 dark:border-border-dark bg-white dark:bg-card-dark flex gap-3">
                                <button class="p-2 text-slate-400 hover:text-primary bg-slate-100 dark:bg-slate-800 rounded-xl"><span class="material-symbols-outlined">attach_file</span></button>
                                <input type="text" id="chat-inp" placeholder="พิมพ์ข้อความ..." onkeypress="if(event.key==='Enter') app.sendMsg()" class="flex-1 bg-slate-100 dark:bg-slate-900 border-none px-4 py-2 rounded-xl text-sm outline-none focus:ring-2 focus:ring-primary dark:text-white">
                                <button onclick="app.sendMsg()" class="p-2 bg-primary text-white rounded-xl hover:bg-primary/90"><span class="material-symbols-outlined">send</span></button>
                            </div>
                        </div>
                    </div>

                    <!-- Extension Request Modal -->
                    <div id="modal-ext" class="hidden fixed inset-0 z-[60] bg-slate-900/60 backdrop-blur-sm items-center justify-center p-4">

                            <button onclick="app.closeModal('modal-ext')" class="absolute top-4 right-4 text-slate-400 hover:text-slate-700"><span class="material-symbols-outlined">close</span></button>
                            <h3 class="text-xl font-bold dark:text-white mb-2">ขอขยายเวลาจัดส่ง</h3>
                            <input type="hidden" id="ext-order-id">

                                <div>
                                    <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-1">ต้องการขอเพิ่มกี่วัน?</label>
                                    <input type="number" id="ext-days" placeholder="เช่น 7" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl h-12 px-4 outline-none focus:border-primary dark:text-white">
                                </div>
                                <div>
                                    <label class="block text-sm font-bold text-slate-700 dark:text-slate-300 mb-1">เหตุผล (จำเป็น)</label>
                                    <textarea id="ext-reason" rows="3" placeholder="ระบุเหตุผล เช่น สินค้าพรีออเดอร์เลื่อนวันส่ง..." class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-4 outline-none focus:border-primary dark:text-white"></textarea>
                                </div>
                            </div>
                            <button onclick="app.requestExtAction()" class="w-full py-3 bg-primary text-white font-bold rounded-xl hover:bg-primary/90">ส่งคำร้องให้ Admin</button>
                        </div>
                    </div>

                    <!-- Reject Extension Modal -->
                    <div id="modal-reject" class="hidden fixed inset-0 z-[60] bg-slate-900/60 backdrop-blur-sm items-center justify-center p-4">

                            <input type="hidden" id="rev-order-id">
                            <div class="flex justify-center gap-2 mb-6 text-warning">
                                <span class="material-symbols-outlined icon-fill text-4xl cursor-pointer rev-star transition hover:scale-110" onclick="app.setRating(this)">star</span>
                                <span class="material-symbols-outlined icon-fill text-4xl cursor-pointer rev-star transition hover:scale-110" onclick="app.setRating(this)">star</span>
                                <span class="material-symbols-outlined icon-fill text-4xl cursor-pointer rev-star transition hover:scale-110" onclick="app.setRating(this)">star</span>
                                <span class="material-symbols-outlined icon-fill text-4xl cursor-pointer rev-star transition hover:scale-110" onclick="app.setRating(this)">star</span>
                                <span class="material-symbols-outlined icon-fill text-4xl cursor-pointer rev-star transition hover:scale-110" onclick="app.setRating(this)">star</span>
                            </div>
                            <textarea id="rev-comment" rows="3" placeholder="พิมพ์รีวิวสั้นๆ..." class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl p-4 outline-none focus:border-warning dark:text-white mb-6"></textarea>
                            <button onclick="app.submitReview()" class="w-full py-3 bg-warning text-white font-bold rounded-xl hover:bg-warning/90 shadow-lg shadow-warning/20">ส่งรีวิว</button>
                        </div>

        document.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
</html>
